<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h2>Inicio do Formulário</h2>
    <form action="login.html" method="get">
        Informe seu nome completo:<br>
        <input type="text" name="nome" id="nome" /><br>

        Selecione o tipo de combustivel:<br>
        <input type="radio" name="gas" id="gas" value="gas">Gasolina<br>
        <input type="radio" name="gas" id="gas2" value="acl">Alcool<br>
        <input type="radio" name="gas" id="gas3" value="GNV">GNV<br>
        <input type="radio" name="gas" id="gas4" value="flex">Flex<br>

        Selecione o tipo de combustivel:<br>
        <input type="checkbox" name="gas" id="gas5" value="gas">Gasolina<br>
        <input type="checkbox" name="gas" id="gas6" value="acl">Alcool<br>
        <input type="checkbox" name="gas" id="gas7" value="GNV">GNV<br>
        <input type="checkbox" name="gas" id="gas8" value="flex">Flex<br>

        Escolha o Fabricante do carro:<br>
        <select name="car" id="car">
            <option value="fiat">Fiat</option>
            <option value="hyundai">Hyundai</option>
            <option value="BYD">BYD</option>
            <option value="Honda">Honda</option>
        </select>
        <br>
        Sugestões:<br>
        <textarea name="dica" id="dica" cols="30" rows="10"></textarea><br>
    </form>
</body>
</html>
